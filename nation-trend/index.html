<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>Nation &amp; Archer Trend Explorer</title>
<script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
<style>
  body { font-family: -apple-system, Helvetica, Arial, sans-serif; margin: 24px; color: #222; }
  h1 { font-size: 20px; }
  h2 { font-size: 16px; margin-top: 48px; border-top: 1px solid #ddd; padding-top: 16px; }
  .row { display: flex; gap: 24px; flex-wrap: wrap; margin-bottom: 12px; }
  .col { min-width: 240px; }
  label { display: block; font-size: 13px; color: #555; margin-bottom: 4px; }
  input[type=text] { width: 100%; padding: 4px; margin-bottom: 4px; box-sizing: border-box; }
  select { width: 100%; padding: 4px; }
  select[multiple] { height: 220px; }
  .chart { width: 100%; height: 520px; }
  .empty-note { color: #888; font-size: 13px; }
</style>
</head>
<body>

<h1>Nation &amp; Archer Trend Explorer</h1>
<div id="panels"></div>

<script>
const DATA_URL = "index.data.json";
const ROUND_LABELS = {"70m": "Senior recurve (70m)", "compound50": "Compound (50m)"};
let DATA = null;

function populate(select, items) {
  select.innerHTML = '';
  items.forEach(name => {
    const o = document.createElement('option');
    o.value = name; o.textContent = name;
    select.appendChild(o);
  });
}

function filterList(input, select, items, preserveSelection) {
  input.addEventListener('input', () => {
    const q = input.value.toLowerCase();
    const selected = preserveSelection
      ? Array.from(select.selectedOptions).map(o => o.value) : [];
    populate(select, items.filter(n => n.toLowerCase().includes(q)));
    if (preserveSelection) {
      Array.from(select.options).forEach(o => { if (selected.includes(o.value)) o.selected = true; });
    }
  });
}

function nationSeries(roundData, nation) {
  const d = roundData.nation_top10[nation] || {};
  return roundData.years.map(y => (y in d) ? d[y] : null);
}

function archerSeries(roundData, archer) {
  const d = roundData.archer_year[archer] || {};
  return roundData.years.map(y => (y in d) ? d[y] : null);
}

function buildPanel(roundKey, roundData, label) {
  const panels = document.getElementById('panels');
  const section = document.createElement('div');

  if (!roundData.nations.length && !roundData.gb_archers.length) {
    section.innerHTML = `<h2>${label}</h2><p class="empty-note">No data for this round type.</p>`;
    panels.appendChild(section);
    return;
  }

  const archerFilterId = `archerFilter_${roundKey}`;
  const archerSelectId = `archerSelect_${roundKey}`;
  const natFilterId = `natFilter_${roundKey}`;
  const natSelectId = `natSelect_${roundKey}`;
  const chartId = `chart_${roundKey}`;

  section.innerHTML = `
    <h2>${label}</h2>
    <div class="row">
      <div class="col">
        <label>Search &amp; select GB archers to compare</label>
        <input type="text" id="${archerFilterId}" placeholder="type a surname...">
        <select id="${archerSelectId}" multiple></select>
      </div>
      <div class="col">
        <label>Search &amp; select nations to compare against</label>
        <input type="text" id="${natFilterId}" placeholder="type a nation...">
        <select id="${natSelectId}" multiple></select>
      </div>
    </div>
    <div id="${chartId}" class="chart"></div>
  `;
  panels.appendChild(section);

  const archerSelect = document.getElementById(archerSelectId);
  const natSelect = document.getElementById(natSelectId);

  function draw() {
    const archers = Array.from(archerSelect.selectedOptions).map(o => o.value);
    const nations = Array.from(natSelect.selectedOptions).map(o => o.value);

    const traces = nations.map(n => ({
      x: roundData.years, y: nationSeries(roundData, n), name: n + ' (top 10)',
      mode: 'lines+markers', line: { width: 2, dash: 'dash' }, connectgaps: true,
    }));
    const archerColors = ['#e34948', '#1baf7a', '#eda100', '#4a3aa7', '#e87ba4', '#008300'];
    archers.forEach((archer, i) => {
      traces.push({
        x: roundData.years, y: archerSeries(roundData, archer), name: archer,
        mode: 'lines+markers', line: { width: 4, color: archerColors[i % archerColors.length] },
        marker: { size: 9 }, connectgaps: true,
      });
    });

    Plotly.react(chartId, traces, {
      title: label,
      xaxis: { title: 'Year', type: 'category' },
      yaxis: { title: 'Average score' },
      margin: { t: 40 },
    }, { responsive: true });
  }

  populate(natSelect, roundData.nations);
  populate(archerSelect, roundData.gb_archers);
  filterList(document.getElementById(natFilterId), natSelect, roundData.nations, true);
  filterList(document.getElementById(archerFilterId), archerSelect, roundData.gb_archers, true);
  natSelect.addEventListener('change', draw);
  archerSelect.addEventListener('change', draw);
  draw();
}

function init() {
  Object.keys(ROUND_LABELS).forEach(roundKey => {
    const roundData = DATA.rounds[roundKey];
    if (roundData) buildPanel(roundKey, roundData, ROUND_LABELS[roundKey]);
  });
}

fetch(DATA_URL)
  .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
  .then(json => { DATA = json; init(); })
  .catch(err => {
    document.body.innerHTML = `<p style="color:#c0392b">Failed to load ${DATA_URL}: ${err.message}.<br>
    Make sure it sits next to this HTML file.</p>`;
  });
</script>
</body>
</html>
