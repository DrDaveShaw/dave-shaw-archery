<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>Nation &amp; Archer Trend Explorer</title>
<script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
<style>
  body { font-family: -apple-system, Helvetica, Arial, sans-serif; margin: 24px; color: #222; }
  h1 { font-size: 20px; }
  h2 { font-size: 16px; margin-top: 48px; border-top: 1px solid #ddd; padding-top: 16px; }
  h3 { font-size: 14px; margin-top: 32px; color: #444; }
  .boxplot-scroll { overflow-x: auto; border: 1px solid #eee; border-radius: 6px; }
  .row { display: flex; gap: 24px; flex-wrap: wrap; margin-bottom: 12px; }
  .col { min-width: 240px; }
  label { display: block; font-size: 13px; color: #555; margin-bottom: 4px; }
  input[type=text] { width: 100%; padding: 4px; margin-bottom: 4px; box-sizing: border-box; }
  select { width: 100%; padding: 4px; }
  select[multiple] { height: 220px; }
  .chart { width: 100%; height: 520px; }
  .empty-note { color: #888; font-size: 13px; }
  #tabs { display: flex; gap: 4px; border-bottom: 2px solid #ddd; margin-bottom: 8px; }
  .tab-btn { background: none; border: none; padding: 10px 18px; font-size: 14px;
             cursor: pointer; color: #666; border-bottom: 2px solid transparent;
             margin-bottom: -2px; }
  .tab-btn:hover { color: #222; }
  .tab-btn.active { color: #185fa5; border-bottom-color: #185fa5; font-weight: 600; }
</style>
</head>
<body>

<h1>Nation &amp; Archer Trend Explorer</h1>
<div id="tabs"></div>
<div id="panels"></div>

<script>
const DATA_URL = "index.data.json";
const ROUND_LABELS = {"70m": "Senior recurve (70m)", "compound50": "Compound (50m)", "barebow50": "Barebow (50m)"};
const DEPTHS = [10, 20, 50, 100, 500];
let DATA = null;

function populate(select, items) {
  select.innerHTML = '';
  items.forEach(name => {
    const o = document.createElement('option');
    o.value = name; o.textContent = name;
    select.appendChild(o);
  });
}

function filterList(input, select, items, preserveSelection) {
  input.addEventListener('input', () => {
    const q = input.value.toLowerCase();
    const selected = preserveSelection
      ? Array.from(select.selectedOptions).map(o => o.value) : [];
    populate(select, items.filter(n => n.toLowerCase().includes(q)));
    if (preserveSelection) {
      Array.from(select.options).forEach(o => { if (selected.includes(o.value)) o.selected = true; });
    }
  });
}

function buildPanel(roundKey, roundData, label) {
  const panels = document.getElementById('panels');
  const section = document.createElement('div');
  section.id = `panel_${roundKey}`;

  if (!roundData.nations.length) {
    section.innerHTML = `<h2>${label}</h2><p class="empty-note">No data for this round type.</p>`;
    panels.appendChild(section);
    return;
  }

  const natFilterId = `natFilter_${roundKey}`;
  const natSelectId = `natSelect_${roundKey}`;
  const depthSelectId = `depthSelect_${roundKey}`;
  const chartId = `chart_${roundKey}`;

  const boxNatFilterId = `boxNatFilter_${roundKey}`;
  const boxNatSelectId = `boxNatSelect_${roundKey}`;
  const boxAllId = `boxAll_${roundKey}`;
  const boxChartId = `boxChart_${roundKey}`;

  section.innerHTML = `
    <h2>${label}</h2>
    <div class="row">
      <div class="col">
        <label>Search &amp; select nations</label>
        <input type="text" id="${natFilterId}" placeholder="type a nation...">
        <select id="${natSelectId}" multiple></select>
      </div>
      <div class="col">
        <label>Average of top N archers</label>
        <select id="${depthSelectId}">
          ${DEPTHS.map(n => `<option value="${n}"${n===10?' selected':''}>Top ${n}</option>`).join('')}
        </select>
      </div>
    </div>
    <div id="${chartId}" class="chart"></div>

    <h3>Score distribution by nation and year</h3>
    <div class="row">
      <div class="col">
        <label><input type="checkbox" id="${boxAllId}"> Show all nations</label>
        <label style="margin-top:8px">Search &amp; select nations</label>
        <input type="text" id="${boxNatFilterId}" placeholder="type a nation...">
        <select id="${boxNatSelectId}" multiple></select>
      </div>
      <div class="col">
        <p class="empty-note">Only archers averaging 600+ are shown.</p>
      </div>
    </div>
    <div class="boxplot-scroll"><div id="${boxChartId}" class="chart"></div></div>
  `;
  panels.appendChild(section);

  const natSelect = document.getElementById(natSelectId);
  const depthSelect = document.getElementById(depthSelectId);

  function draw() {
    const nations = Array.from(natSelect.selectedOptions).map(o => o.value);
    const depth = depthSelect.value;

    const traces = nations.map(n => {
      const d = roundData.nation_topN[depth][n] || {};
      return {
        x: roundData.years, y: roundData.years.map(y => (y in d) ? d[y] : null),
        name: n, mode: 'lines+markers', line: { width: 2 }, connectgaps: true,
      };
    });

    Plotly.react(chartId, traces, {
      title: `${label} -- average of each nation's top ${depth} archers`,
      xaxis: { title: 'Year', type: 'category' },
      yaxis: { title: 'Average score' },
      margin: { t: 40 },
    }, { responsive: true });
  }

  populate(natSelect, roundData.nations);
  filterList(document.getElementById(natFilterId), natSelect, roundData.nations, true);
  natSelect.addEventListener('change', draw);
  depthSelect.addEventListener('change', draw);
  draw();

  // -- boxplot sub-panel --
  const boxNatSelect = document.getElementById(boxNatSelectId);
  const boxAll = document.getElementById(boxAllId);
  const yearColors = ['#2a78d6', '#e34948', '#1baf7a', '#eda100', '#4a3aa7', '#e87ba4'];
  const HIGH_PERFORMER_THRESHOLD = 600;

  function drawBox() {
    const minScore = HIGH_PERFORMER_THRESHOLD;
    const nations = boxAll.checked
      ? roundData.nations
      : Array.from(boxNatSelect.selectedOptions).map(o => o.value);

    const traces = roundData.years.map((year, i) => {
      const xs = [], ys = [];
      nations.forEach(nation => {
        const vals = (roundData.nation_year_dist[nation] || {})[year] || [];
        vals.forEach(v => { if (v >= minScore) { xs.push(nation); ys.push(v); } });
      });
      return {
        type: 'box', name: year, x: xs, y: ys,
        marker: { color: yearColors[i % yearColors.length] },
        boxpoints: false,
      };
    });

    const chartDiv = document.getElementById(boxChartId);
    chartDiv.style.width = Math.max(700, nations.length * 90) + 'px';

    Plotly.react(boxChartId, traces, {
      title: `${label} -- score distribution (nations on x-axis, colour = year)`,
      xaxis: { title: 'Nation' },
      yaxis: { title: 'Average score' },
      boxmode: 'group',
      margin: { t: 40 },
    }, { responsive: false });
  }

  populate(boxNatSelect, roundData.nations);
  filterList(document.getElementById(boxNatFilterId), boxNatSelect, roundData.nations, true);
  boxNatSelect.addEventListener('change', drawBox);
  boxAll.addEventListener('change', () => {
    boxNatSelect.disabled = boxAll.checked;
    drawBox();
  });
  drawBox();
}

function buildCheckerPanel(tabKey, roundData, label) {
  const panels = document.getElementById('panels');
  const section = document.createElement('div');
  section.id = `panel_${tabKey}`;

  if (!roundData.nations.length) {
    section.innerHTML = `<h2>${label}</h2><p class="empty-note">No data for this round type.</p>`;
    panels.appendChild(section);
    return;
  }

  const scoreInputId = `score_${tabKey}`;
  const natFilterId = `checkNatFilter_${tabKey}`;
  const natSelectId = `checkNatSelect_${tabKey}`;
  const chartId = `checkChart_${tabKey}`;
  const noteId = `checkNote_${tabKey}`;

  section.innerHTML = `
    <h2>${label} -- check your score</h2>
    <div class="row">
      <div class="col">
        <label>Your average score</label>
        <input type="text" id="${scoreInputId}" placeholder="e.g. 620">
      </div>
      <div class="col">
        <label>Search &amp; select countries to compare against</label>
        <input type="text" id="${natFilterId}" placeholder="type a nation...">
        <select id="${natSelectId}" multiple></select>
      </div>
    </div>
    <div class="boxplot-scroll"><div id="${chartId}" class="chart"></div></div>
    <div class="empty-note" id="${noteId}" style="margin-top:12px; font-size:14px;"></div>
  `;
  panels.appendChild(section);

  const scoreInput = document.getElementById(scoreInputId);
  const natSelect = document.getElementById(natSelectId);
  const note = document.getElementById(noteId);

  function pooledDist(nation) {
    const byYear = roundData.nation_year_dist[nation] || {};
    return [].concat(...Object.values(byYear));
  }

  function draw() {
    const nations = Array.from(natSelect.selectedOptions).map(o => o.value);
    const score = parseFloat(scoreInput.value);
    const hasScore = !isNaN(score);

    const traces = nations.map(n => ({
      type: 'box', name: n, y: pooledDist(n), boxpoints: false,
    }));
    const shapes = (hasScore && nations.length) ? [{
      type: 'line', xref: 'paper', x0: 0, x1: 1, y0: score, y1: score,
      line: { color: '#e34948', width: 2, dash: 'dash' },
    }] : [];

    Plotly.react(chartId, traces, {
      title: `${label} -- score distribution, all years pooled`,
      yaxis: { title: 'Average score' },
      shapes: shapes,
      margin: { t: 40 },
    }, { responsive: true });

    if (!hasScore) {
      note.textContent = 'Enter your average score to see where you would rank.';
    } else if (!nations.length) {
      note.textContent = `Score entered: ${score}. Select one or more countries above to see your percentile.`;
    } else {
      const lines = nations.map(n => {
        const vals = pooledDist(n);
        if (!vals.length) return `${n}: no data`;
        const below = vals.filter(v => v < score).length;
        const pct = Math.round(100 * below / vals.length);
        return `${n}: ${score} ranks at the ${pct}th percentile of ${vals.length} archer-seasons`;
      });
      note.textContent = lines.join(' | ');
    }
  }

  populate(natSelect, roundData.nations);
  filterList(document.getElementById(natFilterId), natSelect, roundData.nations, true);
  natSelect.addEventListener('change', draw);
  scoreInput.addEventListener('input', draw);
  draw();
}

function init() {
  const roundKeys = Object.keys(ROUND_LABELS).filter(k => DATA.rounds[k]);
  const tabs = [];
  roundKeys.forEach(roundKey => {
    tabs.push({ id: roundKey, label: ROUND_LABELS[roundKey],
                roundData: DATA.rounds[roundKey], build: buildPanel });
  });
  roundKeys.forEach(roundKey => {
    tabs.push({ id: `check_${roundKey}`, label: ROUND_LABELS[roundKey] + ' checker',
                roundData: DATA.rounds[roundKey], build: buildCheckerPanel });
  });

  tabs.forEach(t => t.build(t.id, t.roundData, t.label));

  const tabBar = document.getElementById('tabs');
  tabs.forEach((t, i) => {
    const btn = document.createElement('button');
    btn.textContent = t.label;
    btn.className = 'tab-btn' + (i === 0 ? ' active' : '');
    btn.addEventListener('click', () => {
      tabs.forEach(other => {
        document.getElementById(`panel_${other.id}`).style.display = (other.id === t.id) ? '' : 'none';
      });
      Array.from(tabBar.children).forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      window.dispatchEvent(new Event('resize'));
    });
    tabBar.appendChild(btn);
  });

  tabs.forEach((t, i) => {
    document.getElementById(`panel_${t.id}`).style.display = (i === 0) ? '' : 'none';
  });
}

fetch(DATA_URL + "?v=" + Date.now())
  .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
  .then(json => { DATA = json; init(); })
  .catch(err => {
    document.body.innerHTML = `<p style="color:#c0392b">Failed to load ${DATA_URL}: ${err.message}.<br>
    Make sure it sits next to this HTML file.</p>`;
  });
</script>
</body>
</html>
