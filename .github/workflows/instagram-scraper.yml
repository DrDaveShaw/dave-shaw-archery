name: Fetch Instagram Coaching Feed
on:
  schedule:
    - cron: '0 0 * * *' # Runs automatically every day at midnight
  workflow_dispatch: # Allows you to manually click a button to refresh it instantly

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Fetch and Filter Instagram Posts
        run: |
          USERNAME="drdaveshaw"
          
          echo "Fetching public feed for $USERNAME..."
          # Hits a clean JSON bridge to get your recent media data
          curl -s "https://instagram.com/$USERNAME/?__a=1&__d=dis" > raw_insta.json
          
          # Creates a clean data directory if it doesn't exist
          mkdir -p _data
          
          # Uses node to parse the feed, look for "#coaching", and output a neat file
          node -e '
          try {
            const fs = require("fs");
            const data = JSON.parse(fs.readFileSync("raw_insta.json", "utf8"));
            const items = data.graphql?.user?.edge_owner_to_timeline_media?.edges || [];
            
            const filtered = items
              .map(edge => ({
                url: edge.node.display_url,
                caption: edge.node.edge_media_to_caption?.edges[0]?.node?.text || "",
                link: `https://instagram.com/p/${edge.node.shortcode}`
              }))
              .filter(post => post.caption.toLowerCase().includes("#coaching"))
              .slice(0, 6); // Keep the top 6 most recent coaching items
            
            fs.writeFileSync("_data/instagram.json", JSON.stringify(filtered, null, 2));
            console.log(`Successfully scraped ${filtered.length} coaching posts.`);
          } catch (e) {
            console.error("Error parsing feed. Profile may be private or rate-limited:", e.message);
            // Fallback to empty array so the site doesn't break
            if (!fs.existsSync("_data/instagram.json")) fs.writeFileSync("_data/instagram.json", "[]");
          }
          '

      - name: Commit and Push Changes
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add _data/instagram.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update filtered Instagram coaching feed [skip ci]" && git push)