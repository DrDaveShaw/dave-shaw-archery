name: Fetch Instagram Coaching Feed
on:
  schedule:
    - cron: '0 0 * * *' # Runs automatically every day at midnight
  workflow_dispatch: # Allows you to manually click a button to refresh it instantly

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Fetch and Filter Instagram Posts
        run: |
          USERNAME="drdaveshaw"
          
echo "Fetching public feed for $USERNAME..."
          # Fetch the feed, allowing failures without breaking the shell
          curl -s "https://instagram.com/$USERNAME/?__a=1&__d=dis" > raw_insta.json || echo "Curl request failed"
          
          mkdir -p _data
          
          # Run node script and catch parsing errors safely
          node -e '
          const fs = require("fs");
          try {
            if (!fs.existsSync("raw_insta.json") || fs.readFileSync("raw_insta.json", "utf8").trim() === "") {
              throw new Error("Raw json file is empty or missing.");
            }
            const data = JSON.parse(fs.readFileSync("raw_insta.json", "utf8"));
            const items = data.graphql?.user?.edge_owner_to_timeline_media?.edges || [];
            
            const filtered = items
              .map(edge => ({
                url: edge.node.display_url,
                caption: edge.node.edge_media_to_caption?.edges[0]?.node?.text || "",
                link: `https://instagram.com/p/${edge.node.shortcode}`
              }))
              .filter(post => post.caption.toLowerCase().includes("#coaching"))
              .slice(0, 6);
            
            fs.writeFileSync("_data/instagram.json", JSON.stringify(filtered, null, 2));
            console.log(`Successfully updated feed data with ${filtered.length} items.`);
          } catch (e) {
            console.log("Instagram blocked the scraper or returned a login page. Falling back safely.");
            // Ensure data file exists even on failure so Jekyll doesn't crash
            if (!fs.existsSync("_data/instagram.json")) {
              fs.writeFileSync("_data/instagram.json", "[]");
            }
          }
          '

      - name: Commit and Push Changes
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add _data/instagram.json
          # Only commit if changes actually exist to avoid empty commit errors
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update filtered Instagram coaching feed [skip ci]" && git push)